<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite Motion Kit · 3D 动作参考</title>
<style>body{margin:0;background:#192731;color:#e2edf2;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}section{background:#263844;border:1px solid #536d7b;border-radius:12px;padding:16px}canvas{width:100%;height:auto}button,select{padding:9px;background:#354f60;color:white;border:1px solid #688497;border-radius:5px;margin:3px}p{color:#b6cbd8}output{display:block;margin:8px}</style>
<main><h1>三维木头人 · 动作参考</h1><p>这是动作参考，不是生成后的角色。先检查姿势、相机方向和完整循环，再交给图像工具生成角色帧。</p><div class="grid"></div></main><script>
const guides=__GUIDES__;
for(const g of guides){const s=document.createElement('section');document.querySelector('.grid').append(s);s.innerHTML='<h2></h2><canvas></canvas><div><button data-id="play">暂停</button><button data-id="back">上一帧</button><button data-id="step">下一帧</button><button data-id="replay">重播</button><select aria-label="速度"><option value="1">正常</option><option value=".25">慢放</option></select><output></output></div>';s.querySelector('h2').textContent=g.name;const c=s.querySelector('canvas'),x=c.getContext('2d'),im=new Image();c.width=g.tile[0];c.height=g.tile[1];im.src=g.image;let t=0,run=true,rate=1,last=performance.now();const frame=()=>Math.min(g.count-1,Math.floor(t/g.seconds*g.count));function draw(){x.fillStyle='#263844';x.fillRect(0,0,c.width,c.height);if(im.complete&&im.naturalWidth)x.drawImage(im,frame()*c.width,0,c.width,c.height,0,0,c.width,c.height);s.querySelector('output').textContent=`${frame()+1} / ${g.count}`;s.querySelector('[data-id="play"]').textContent=run?'暂停':'播放'}s.querySelector('[data-id="play"]').onclick=()=>{run=!run;if(run&&t>=g.seconds)t=0;draw()};for(const [id,d] of [['back',-1],['step',1]])s.querySelector(`[data-id="${id}"]`).onclick=()=>{run=false;let i=frame()+d;i=g.loop?(i+g.count)%g.count:Math.max(0,Math.min(g.count-1,i));t=(i+.001)*g.seconds/g.count;draw()};s.querySelector('[data-id="replay"]').onclick=()=>{t=0;run=true};s.querySelector('select').onchange=e=>rate=Number(e.target.value);function tick(now){if(run){t+=(now-last)/1000*rate;if(g.loop)t%=g.seconds;else if(t>=g.seconds){t=g.seconds;run=false}}last=now;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></html>
